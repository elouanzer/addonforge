# Run with:  docker compose up -d --build
# Add-on URL: http://127.0.0.1:7101/manifest.json (HOST_PORT in .env changes the port)
#
# Optional HTTPS tunnel for other devices (TV, phone), OFF by default:
#   docker compose --profile tunnel up -d --build
#   docker compose logs tunnel      # prints the public https://….trycloudflare.com URL
# Anyone with that URL can reach the add-on. See docs/hosting.md in Addon Forge.

services:
  addon:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "7101"
      LETTERBOXD_DIR: /data
      # Ollama on this computer, seen from inside the container.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Your Letterboxd export (CSV files), read-only. See README.md.
      - ./data:/data:ro
    ports:
      # Bound to 127.0.0.1 only: not reachable from other machines without a tunnel.
      - "127.0.0.1:${HOST_PORT:-7101}:7101"

  tunnel:
    image: cloudflare/cloudflared:2026.10.4
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://addon:7101
    depends_on:
      addon:
        condition: service_healthy
