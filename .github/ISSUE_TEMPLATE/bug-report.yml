name: Bug report
description: A tool, the template or an example doesn't work as documented.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through the Security tab instead (see SECURITY.md). Please remove API keys and personal data from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and full output
      description: For example `node tools/forge.js validate http://127.0.0.1:7100`, with everything it printed.
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `node tools/forge.js doctor`
      render: text
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: "macOS 26, Windows 11, Ubuntu 26.04…"
    validations:
      required: true
